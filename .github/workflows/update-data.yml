name: update-jpx-data

on:
  schedule:
    # JPX は毎週第4営業日（通常は木曜）15:30 JST 掲載。余裕をみて木 17:00 JST に実行。
    - cron: "0 8 * * 4"
    # 祝日で掲載がずれた場合の保険（金 17:00 JST）
    - cron: "0 8 * * 5"
  workflow_dispatch:
    inputs:
      years:
        description: "取得する年（スペース区切り。空なら最新ページのみ）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Show repository layout
        run: ls -R --ignore=.git

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install streamlit pandas plotly requests beautifulsoup4 lxml openpyxl xlrd
          fi

      - name: Fetch JPX data
        run: |
          # scripts/ 配下でもリポジトリ直下でも動くようにする
          if [ -f scripts/fetch_jpx.py ]; then
            SCRIPT=scripts/fetch_jpx.py
          elif [ -f fetch_jpx.py ]; then
            SCRIPT=fetch_jpx.py
          else
            echo "fetch_jpx.py が見つかりません。リポジトリに追加してください。" >&2
            exit 1
          fi
          echo "using $SCRIPT"
          if [ -n "${{ github.event.inputs.years }}" ]; then
            python "$SCRIPT" --out data/investor_weekly.csv --years ${{ github.event.inputs.years }}
          else
            python "$SCRIPT" --out data/investor_weekly.csv
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/investor_weekly.csv; then
            echo "変更なし"
          else
            git add data/investor_weekly.csv
            git commit -m "data: JPX 投資部門別売買状況を更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
